# Netlify build configuration for the MediShield AI frontend.
# In the Netlify UI, set "Base directory" to: frontend-web
# and add an environment variable VITE_API_URL = <your backend URL>.

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side routes (/assess/..., /dashboard) resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
